name: Ubuntu-Terminal-Proxy
on: workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Tools
      run: |
        # 1. Install ttyd and cloudflared
        sudo apt-get update
        sudo apt-get install -y ttyd
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
        chmod +x cloudflared
        
        # 2. Download Gost (High-speed Proxy)
        curl -L https://github.com/go-gost/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz | gunzip > gost
        chmod +x gost

        # 3. Start Terminal on port 7681 in the background
        # We use 'bash' here instead of 'cmd' because this is Linux
        ttyd -p 7681 bash &

        # 4. Start Cloudflare Tunnel
        echo "🌐 YOUR TERMINAL LINK WILL APPEAR BELOW 🌐"
        ./cloudflared tunnel --url http://localhost:7681
        
