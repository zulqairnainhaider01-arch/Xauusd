name: Windows-Terminal-Cloudflare
on: workflow_dispatch

jobs:
  terminal:
    runs-on: windows-latest
    steps:
    - name: Setup Terminal over Web
      run: |
        # 1. Download ttyd (The Web Terminal)
        Invoke-WebRequest https://github.com/tsl0922/ttyd/releases/download/1.7.3/ttyd.win32.exe -OutFile ttyd.exe
        
        # 2. Download cloudflared executable (Directly)
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
        
        # 3. Start Terminal with flags to fix the black screen
        # We add '-t disable_leave_alert=true' and use powershell for better visibility
        Start-Process ./ttyd.exe -ArgumentList "-p 7681 powershell.exe"
        
        # 4. Start Cloudflare Tunnel
        Write-Host "🌐 WAITING FOR CLOUDFLARE TO LINK... 🌐"
        ./cloudflared.exe tunnel --url http://localhost:7681
        
