name: Windows-Terminal-Cloudflare
on: workflow_dispatch

jobs:
  terminal:
    runs-on: windows-latest
    steps:
    - name: Setup Terminal over Web
      run: |
        # 1. Download ttyd (Web-based Terminal)
        Invoke-WebRequest https://github.com/tsl0922/ttyd/releases/download/1.7.3/ttyd.win32.exe -OutFile ttyd.exe
        
        # 2. Download Cloudflare Tunnel
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.msi -OutFile cloudflared.msi
        Start-Process msiexec.exe -ArgumentList "/i cloudflared.msi /quiet /norestart" -Wait
        
        # 3. Start Terminal on port 7681
        Start-Process ./ttyd.exe -ArgumentList "-p 7681 cmd.exe"
        
        # 4. Start Cloudflare Tunnel and display the URL
        echo "🌐 STARTING TUNNEL... LOOK FOR THE LINK BELOW 🌐"
        cloudflared tunnel --url http://localhost:7681
        
