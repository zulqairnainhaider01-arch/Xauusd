name: Ubuntu-Terminal-Proxy
on: workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Tools
      run: |
        # 1. Install ttyd and cloudflared (Official Repos)
        sudo apt-get update
        sudo apt-get install -y ttyd
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
        chmod +x cloudflared
        
        # 2. Start Terminal on port 7681
        ttyd -p 7681 bash &

        # 3. Start a Pure Python Proxy (No extra downloads needed)
        # This creates a simple HTTP proxy on port 8888
        python3 -c "import socket, threading; 
        def handle(c): 
          try: 
            d=c.recv(1024); 
            host=d.split(b' ')[1].split(b'/')[2].decode(); 
            s=socket.socket(); 
            s.connect((host, 80)); 
            s.sendall(d); 
            while 1: 
              data=s.recv(1024); 
              if not data: break
              c.sendall(data)
          except: pass
        s=socket.socket(); s.bind(('0.0.0.0', 8888)); s.listen(5);
        while 1: c,a=s.accept(); threading.Thread(target=handle, args=(c,)).start()" &

        # 4. Start Cloudflare Tunnel
        echo "🌐 YOUR TERMINAL LINK WILL APPEAR BELOW 🌐"
        ./cloudflared tunnel --url http://localhost:7681
        
