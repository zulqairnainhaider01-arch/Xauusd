name: 2026-Speed-Bypass
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Speed-Optimized Proxy
        run: |
          # 1. Install a standard HTTP proxy (less suspicious than Gost)
          sudo apt-get update && sudo apt-get install -y tinyproxy
          
          # 2. Configure tinyproxy to allow all connections on port 8888
          echo "Port 8888" | sudo tee /etc/tinyproxy/tinyproxy.conf
          echo "Allow 0.0.0.0/0" | sudo tee -a /etc/tinyproxy/tinyproxy.conf
          sudo service tinyproxy restart
          
          # 3. Use Cloudflare's official binary to tunnel Port 8888
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://localhost:8888
